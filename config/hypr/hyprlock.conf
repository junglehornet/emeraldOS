general {
    hide_cursor = true
}
background {
    monitor =
    path = /home/junglehornet/.config/hypr/wallpapers/emerald.png
    color = rgb(0e1512)
    blur_passes = 2
    blur_size = 6
}
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    outer_color = rgb(50d890)
    inner_color = rgb(111916)
    font_color = rgb(dce8e0)
    check_color = rgb(77f2ac)
    fail_color = rgb(ef8888)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    rounding = 12
    position = 0, -100
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgb(dce8e0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(50d890)
    font_size = 18
    font_family = Adwaita Sans
    position = 0, 20
    halign = center
    valign = center
}
