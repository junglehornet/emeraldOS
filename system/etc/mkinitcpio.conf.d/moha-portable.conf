# Include graphics and storage modules for other machines, rather than limiting
# the image to the hardware present during installation. Keep encryption/LVM
# and other hooks selected by archinstall.
moha_hooks=()
moha_has_kms=false
for moha_hook in "${HOOKS[@]}"; do
    [[ $moha_hook == autodetect ]] && continue
    moha_hooks+=("$moha_hook")
    [[ $moha_hook != kms ]] || moha_has_kms=true
done
if [[ $moha_has_kms == false ]]; then
    moha_hooks+=(kms)
fi
HOOKS=("${moha_hooks[@]}")
unset moha_hooks moha_hook moha_has_kms
